openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: UPSC 2028 and SPIPA 2027 study and lifestyle command center
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Study dashboard summary
  - name: study
    description: Study logs and 15-day sprint
  - name: wellness
    description: Health, fitness, and lifestyle tracking
  - name: habits
    description: Daily habit tracking
  - name: subjects
    description: Long-term subject and topic planning
  - name: settings
    description: Personal command center settings
  - name: notion
    description: Notion tasks and schedule proxy
  - name: calendar
    description: Google Calendar and availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get today's study and wellness summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /study-logs:
    get:
      operationId: getStudyLogs
      tags: [study]
      summary: List recent study sessions
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyLog"
    post:
      operationId: createStudyLog
      tags: [study]
      summary: Record a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyLogInput"
      responses:
        "201":
          description: Study session recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLog"
  /sprint-tasks:
    get:
      operationId: getSprintTasks
      tags: [study]
      summary: Get the current 15-day sprint
      responses:
        "200":
          description: Sprint tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SprintTask"
    post:
      operationId: createSprintTask
      tags: [study]
      summary: Add a target to the sprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintTaskInput"
      responses:
        "201":
          description: Sprint task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintTask"
  /sprint-tasks/{id}:
    patch:
      operationId: updateSprintTask
      tags: [study]
      summary: Update a sprint target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintTaskUpdate"
      responses:
        "200":
          description: Updated sprint task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintTask"
        "404":
          description: Sprint task not found
  /health-logs:
    get:
      operationId: getHealthLogs
      tags: [wellness]
      summary: List recent daily health records
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Daily health records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthLog"
    post:
      operationId: saveHealthLog
      tags: [wellness]
      summary: Save or update today's health record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthLogInput"
      responses:
        "200":
          description: Saved daily health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLog"
  /meal-logs:
    get:
      operationId: getMealLogs
      tags: [wellness]
      summary: List meals for a date
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Meal records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealLog"
    post:
      operationId: createMealLog
      tags: [wellness]
      summary: Log a meal and its calories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealLogInput"
      responses:
        "201":
          description: Meal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealLog"
  /meal-logs/{id}:
    delete:
      operationId: deleteMealLog
      tags: [wellness]
      summary: Remove a meal record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Meal removed
        "404":
          description: Meal not found
  /workout-logs:
    get:
      operationId: getWorkoutLogs
      tags: [wellness]
      summary: List workout records
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Workout records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutLog"
    post:
      operationId: createWorkoutLog
      tags: [wellness]
      summary: Record a workout set block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogInput"
      responses:
        "201":
          description: Workout recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLog"
  /habits:
    get:
      operationId: getHabits
      tags: [habits]
      summary: Get habits and recent daily check-ins
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 30
      responses:
        "200":
          description: Habit list and check-in history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitDashboard"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a good or bad habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Habit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "409":
          description: The 20-habit limit has been reached
  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Edit or archive a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Habit not found
  /habit-checkins:
    post:
      operationId: saveHabitCheckin
      tags: [habits]
      summary: Save a daily habit check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCheckinInput"
      responses:
        "200":
          description: Saved daily check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCheckin"
  /subjects:
    get:
      operationId: getSubjects
      tags: [subjects]
      summary: List long-term subject modules and topic checklists
      responses:
        "200":
          description: Subject modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectModule"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Add a future subject module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectModuleInput"
      responses:
        "201":
          description: Subject module created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectModule"
  /subjects/{id}:
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update a subject module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectModuleUpdate"
      responses:
        "200":
          description: Updated subject module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectModule"
        "404":
          description: Subject module not found
  /subject-topics:
    post:
      operationId: createSubjectTopic
      tags: [subjects]
      summary: Add a topic to a subject module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectTopicInput"
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectTopic"
  /subject-topics/{id}:
    patch:
      operationId: updateSubjectTopic
      tags: [subjects]
      summary: Update or complete a topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectTopicUpdate"
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectTopic"
        "404":
          description: Topic not found
  /subjects/auto-schedule:
    post:
      operationId: autoScheduleSubjects
      tags: [subjects, calendar]
      summary: Allocate unassigned future topics to open Google Calendar slots
      responses:
        "200":
          description: Topic scheduling result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoScheduleResponse"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get command center preferences
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update command center preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /notion/databases:
    get:
      operationId: getNotionDatabases
      tags: [notion]
      summary: Find databases shared with the Notion connection
      responses:
        "200":
          description: Shared Notion databases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotionDatabase"
  /notion/tasks:
    get:
      operationId: getNotionTasks
      tags: [notion]
      summary: Query tasks from the selected Notion database
      responses:
        "200":
          description: Notion tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotionItem"
    post:
      operationId: createNotionTask
      tags: [notion]
      summary: Create a task in the selected Notion database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotionTaskInput"
      responses:
        "201":
          description: Created Notion task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotionItem"
  /notion/schedule:
    get:
      operationId: getNotionSchedule
      tags: [notion]
      summary: Query schedule entries from the selected Notion database
      responses:
        "200":
          description: Notion schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotionItem"
  /calendar/events:
    get:
      operationId: getCalendarEvents
      tags: [calendar]
      summary: List upcoming Google Calendar events
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: Upcoming calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Add an event to Google Calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
  /calendar/free-slots:
    get:
      operationId: getFreeSlots
      tags: [calendar]
      summary: Find open time blocks over the next several days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 14
            default: 7
      responses:
        "200":
          description: Available blocks in Asia/Kolkata time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreeSlot"
  /calendar/sync:
    post:
      operationId: syncNotionAndCalendar
      tags: [calendar, notion]
      summary: Reconcile Notion task dates and linked Google Calendar events
      responses:
        "200":
          description: Synchronization results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSummary"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    DashboardSummary:
      type: object
      required: [date, studyMinutesToday, studyTargetMinutes, studyStreak, waterMl, waterGoalMl, sleepHours, weightKg, mealCalories, steps, stepGoal]
      properties:
        date: { type: string, format: date }
        studyMinutesToday: { type: integer }
        studyTargetMinutes: { type: integer }
        studyStreak: { type: integer }
        waterMl: { type: integer }
        waterGoalMl: { type: integer }
        sleepHours: { type: ["number", "null"] }
        weightKg: { type: ["number", "null"] }
        mealCalories: { type: integer }
        steps: { type: integer }
        stepGoal: { type: integer }
    StudyLog:
      type: object
      required: [id, date, subject, durationMinutes, notes, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        subject: { type: string }
        durationMinutes: { type: integer }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    StudyLogInput:
      type: object
      required: [date, subject, durationMinutes]
      properties:
        date: { type: string, format: date }
        subject: { type: string, minLength: 1, maxLength: 120 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        notes: { type: string, maxLength: 1000 }
    SprintTask:
      type: object
      required: [id, dayNumber, title, subject, target, completed, priority]
      properties:
        id: { type: integer }
        dayNumber: { type: integer, minimum: 1, maximum: 15 }
        title: { type: string }
        subject: { type: string }
        target: { type: string }
        completed: { type: boolean }
        priority: { type: string, enum: [high, medium, low] }
    SprintTaskInput:
      type: object
      required: [dayNumber, title, subject, target, priority]
      properties:
        dayNumber: { type: integer, minimum: 1, maximum: 15 }
        title: { type: string, minLength: 1, maxLength: 200 }
        subject: { type: string, minLength: 1, maxLength: 120 }
        target: { type: string, minLength: 1, maxLength: 500 }
        priority: { type: string, enum: [high, medium, low] }
    SprintTaskUpdate:
      type: object
      minProperties: 1
      properties:
        completed: { type: boolean }
        title: { type: string, minLength: 1, maxLength: 200 }
        subject: { type: string, minLength: 1, maxLength: 120 }
        target: { type: string, minLength: 1, maxLength: 500 }
        priority: { type: string, enum: [high, medium, low] }
    HealthLog:
      type: object
      required: [id, date, weightKg, waterMl, sleepHours, steps]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        weightKg: { type: ["number", "null"] }
        waterMl: { type: integer }
        sleepHours: { type: ["number", "null"] }
        steps: { type: integer }
    HealthLogInput:
      type: object
      required: [date]
      minProperties: 2
      properties:
        date: { type: string, format: date }
        weightKg: { type: ["number", "null"], minimum: 20, maximum: 400 }
        waterMl: { type: integer, minimum: 0, maximum: 20000 }
        sleepHours: { type: ["number", "null"], minimum: 0, maximum: 24 }
        steps: { type: integer, minimum: 0, maximum: 100000 }
    MealLog:
      type: object
      required: [id, date, name, calories, mealType, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        name: { type: string }
        calories: { type: integer }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
        createdAt: { type: string, format: date-time }
    MealLogInput:
      type: object
      required: [date, name, calories, mealType]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 120 }
        calories: { type: integer, minimum: 0, maximum: 10000 }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
    WorkoutLog:
      type: object
      required: [id, date, exerciseName, sets, repsPerSet, weightPerSet, weightUnit, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        exerciseName: { type: string }
        sets: { type: integer }
        repsPerSet: { type: integer }
        weightPerSet: { type: number }
        weightUnit: { type: string, enum: [kg, lbs] }
        createdAt: { type: string, format: date-time }
    WorkoutLogInput:
      type: object
      required: [date, exerciseName, sets, repsPerSet, weightPerSet, weightUnit]
      properties:
        date: { type: string, format: date }
        exerciseName: { type: string, minLength: 1, maxLength: 120 }
        sets: { type: integer, minimum: 1, maximum: 50 }
        repsPerSet: { type: integer, minimum: 1, maximum: 500 }
        weightPerSet: { type: number, minimum: 0, maximum: 2000 }
        weightUnit: { type: string, enum: [kg, lbs] }
    Habit:
      type: object
      required: [id, name, category, description, active, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string, enum: [good, bad] }
        description: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    HabitInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [good, bad] }
        description: { type: string, maxLength: 500 }
    HabitUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [good, bad] }
        description: { type: ["string", "null"], maxLength: 500 }
        active: { type: boolean }
    HabitCheckin:
      type: object
      required: [id, habitId, date, completed]
      properties:
        id: { type: integer }
        habitId: { type: integer }
        date: { type: string, format: date }
        completed: { type: boolean }
    HabitCheckinInput:
      type: object
      required: [habitId, date, completed]
      properties:
        habitId: { type: integer }
        date: { type: string, format: date }
        completed: { type: boolean }
    HabitDashboard:
      type: object
      required: [habits, checkins]
      properties:
        habits:
          type: array
          items:
            $ref: "#/components/schemas/Habit"
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/HabitCheckin"
    SubjectTopic:
      type: object
      required: [id, moduleId, title, completed, estimatedHours]
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        title: { type: string }
        completed: { type: boolean }
        estimatedHours: { type: ["number", "null"] }
    SubjectModule:
      type: object
      required: [id, title, startDate, endDate, estimatedHours, status, topics]
      properties:
        id: { type: integer }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        estimatedHours: { type: number }
        status: { type: string, enum: [planned, in-progress, complete] }
        topics:
          type: array
          items:
            $ref: "#/components/schemas/SubjectTopic"
    SubjectModuleInput:
      type: object
      required: [title, startDate, endDate, estimatedHours]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        estimatedHours: { type: number, minimum: 1, maximum: 2000 }
        topics:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
    SubjectModuleUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        estimatedHours: { type: number, minimum: 1, maximum: 2000 }
        status: { type: string, enum: [planned, in-progress, complete] }
    SubjectTopicInput:
      type: object
      required: [moduleId, title]
      properties:
        moduleId: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        estimatedHours: { type: ["number", "null"], minimum: 0.25, maximum: 100 }
    SubjectTopicUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        completed: { type: boolean }
        estimatedHours: { type: ["number", "null"], minimum: 0.25, maximum: 100 }
    AutoScheduleAssignment:
      type: object
      required: [topicId, topicTitle, subjectTitle, eventId, start, end]
      properties:
        topicId: { type: integer }
        topicTitle: { type: string }
        subjectTitle: { type: string }
        eventId: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    AutoScheduleResponse:
      type: object
      required: [createdEvents, assignments, message]
      properties:
        createdEvents: { type: integer }
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AutoScheduleAssignment"
        message: { type: string }
    AppSettings:
      type: object
      required: [dailyStudyTargetMinutes, waterGoalMl, sleepGoalHours, notionTasksDatabaseId, notionScheduleDatabaseId, calendarId, dayStartHour, dayEndHour, spipaExamDate, upscPrelimsDate, stepGoal]
      properties:
        dailyStudyTargetMinutes: { type: integer }
        waterGoalMl: { type: integer }
        sleepGoalHours: { type: number }
        notionTasksDatabaseId: { type: ["string", "null"] }
        notionScheduleDatabaseId: { type: ["string", "null"] }
        calendarId: { type: string }
        dayStartHour: { type: integer }
        dayEndHour: { type: integer }
        spipaExamDate: { type: string, format: date }
        upscPrelimsDate: { type: string, format: date }
        stepGoal: { type: integer }
